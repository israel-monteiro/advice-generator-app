<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- displays site properly based on user's device -->

        <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />

        <title>Frontend Mentor | Advice generator app</title>
        <link rel="stylesheet" href="./src/css/reset.css">
        <link rel="stylesheet" href="./src/css/variables.css">
        <link rel="stylesheet" href="./src/css/style.css">

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet" />
    </head>
    <body>
        <main class="container">
            <div class="advice-card">
                <p class="advice-card__id">Advice #117</p>
                <h1 class="advice-card__text">
                    “It is easy to sit up and take notice, what’s difficult is getting up and taking action.”
                </h1>
                <picture class="advice-card__divider">
                    <source media="(min-width: 768px)" srcset="./assets/images/pattern-divider-desktop.svg" />
                    <img src="./assets/images/pattern-divider-mobile.svg" alt="" />
                </picture>
                <button class="advice-card__button" type="button" aria-label="Generate new advice">
                    <img src="./assets/images/icon-dice.svg" alt="" />
                </button>
            </div>
        </main>
    </body>
</html>
